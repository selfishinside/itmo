spring.application.name=love


spring.config.import=optional:file:.env[.properties],optional:file:love/.env[.properties]

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_booking
spring.datasource.username=postgres
spring.datasource.password=password 
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.transaction.coordinator_class=jta
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.JBossStandAloneJtaPlatform

# JAAS user store
security.jaas.users-xml=classpath:jaas-users.xml

# Logging
logging.level.root=INFO
logging.level.ru.itmo.love=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.arjuna=INFO

# Идентификатор вычислительного узла виден в логах consumers.
app.node-id=${NODE_ID:node-1}

# Kafka + ZooKeeper запускаются через docker-compose.yml в корне лабораторной.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Топики асинхронных бизнес-событий.
app.kafka.topics.booking-confirmed=booking.confirmed
app.kafka.topics.review-submitted=review.submitted
app.kafka.topics.check-in-reminder=check-in.reminder

# Расписания вынесены в конфигурацию, чтобы их можно было ускорить на демонстрации.
app.scheduling.check-in-reminder-cron=${CHECK_IN_REMINDER_CRON:0 0 10 * * *}
app.scheduling.notification-retry-rate=${NOTIFICATION_RETRY_RATE:1800000}
app.scheduling.rating-update-cron=${RATING_UPDATE_CRON:0 0 * * * *}

# Webhook внешней EIS Bitrix24 обязателен для любого профиля, включая локальный.
app.bitrix.base-url=${BITRIX_BASE_URL}
app.bitrix.fail-next-call=${BITRIX_FAIL_NEXT_CALL:false}
app.bitrix.responsible-id=${BITRIX_RESPONSIBLE_ID:1}

# Swagger UI доступен по /swagger-ui.html.
springdoc.swagger-ui.path=/swagger-ui.html
