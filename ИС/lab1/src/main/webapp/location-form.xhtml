<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Форма Location</title>
    <style type="text/css">body { padding: 20px; }</style>
</h:head>
<h:body>
    <f:metadata>
        <f:viewParam name="id" value="#{locationViewBean.locationId}"/>
        <f:viewAction action="#{locationViewBean.loadLocation}"/>
    </f:metadata>
    <h:form id="locationForm">
        <p:panel header="#{locationViewBean.locationId == null ? 'Создание Location' : 'Редактирование Location'}">
            <p:messages id="messages" showDetail="true"/>
            <p:panelGrid id="locationGrid" columns="2" layout="grid" styleClass="ui-fluid">
                <p:outputLabel for="name" value="Name:"/>
                <p:inputText id="name" value="#{locationViewBean.selectedLocation.name}" required="true"/>
                <p:outputLabel for="x" value="X:"/>
                <p:inputNumber id="x" value="#{locationViewBean.selectedLocation.x}" decimalPlaces="2" required="true"/>
                <p:outputLabel for="y" value="Y:"/>
                <p:inputNumber id="y" value="#{locationViewBean.selectedLocation.y}" required="true"/>
            </p:panelGrid>
            <f:facet name="footer">
                <p:commandButton value="Сохранить" icon="pi pi-check" action="#{locationViewBean.saveOrUpdateLocation}" process="@form" update="messages locationGrid"/>
                <p:button value="Отмена" icon="pi pi-times" href="locations.xhtml" styleClass="ui-button-secondary" style="margin-left:.5rem;"/>
            </f:facet>
        </p:panel>
    </h:form>
</h:body>
</html>
