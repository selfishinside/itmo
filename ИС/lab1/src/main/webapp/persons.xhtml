<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Персоны</title>
    <style type="text/css">body { padding: 20px; }</style>
</h:head>
<h:body>
    <h:form id="mainForm">
        <p:toolbar>
            <p:toolbarGroup>
                <p:button value="На главную" icon="pi pi-home" href="index.xhtml" styleClass="ui-button-secondary"/>
            </p:toolbarGroup>
        </p:toolbar>

        <p:panel header="Фильтрация по строковым колонкам" style="margin-top:20px;">
            <p:panelGrid columns="4" styleClass="ui-fluid">
                <p:selectOneMenu value="#{personViewBean.selectedFilterColumn}">
                    <f:selectItem itemLabel="Колонка" itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{personViewBean.availableColumns}"/>
                </p:selectOneMenu>
                <p:inputText value="#{personViewBean.filterValue}" placeholder="Полное совпадение"/>
                <p:commandButton value="Найти" icon="pi pi-search" actionListener="#{personViewBean.applyGlobalFilter}" update="personTable"/>
                <p:commandButton value="Сброс" icon="pi pi-times" actionListener="#{personViewBean.clearGlobalFilter}" update="personTable" styleClass="ui-button-secondary"/>
            </p:panelGrid>
        </p:panel>

        <p:dataTable id="personTable" var="person" value="#{personViewBean.filteredPersons}" paginator="true" rows="10"
                     rowsPerPageTemplate="5,10,20" style="margin-top:20px;" emptyMessage="Person не найдены">
            <p:column headerText="ID" sortBy="#{person.id}"><h:outputText value="#{person.id}"/></p:column>
            <p:column headerText="Имя" sortBy="#{person.name}"><h:outputText value="#{person.name}"/></p:column>
            <p:column headerText="Глаза" sortBy="#{person.eyeColor}"><h:outputText value="#{person.eyeColor}"/></p:column>
            <p:column headerText="Волосы" sortBy="#{person.hairColor}"><h:outputText value="#{person.hairColor}"/></p:column>
            <p:column headerText="Location"><h:outputText value="#{person.location != null ? person.location.displayName : 'нет'}"/></p:column>
            <p:column headerText="Birthday" sortBy="#{person.birthday}"><h:outputText value="#{person.birthday}"/></p:column>
            <p:column headerText="Рост" sortBy="#{person.height}"><h:outputText value="#{person.height}"/></p:column>
            <p:column headerText="Вес" sortBy="#{person.weight}"><h:outputText value="#{person.weight}"/></p:column>
            <p:column headerText="Страна" sortBy="#{person.nationality}"><h:outputText value="#{person.nationality}"/></p:column>
            <p:column headerText="Действия" style="width:8rem;text-align:center;">
                <p:button icon="pi pi-pencil" outcome="person-form.xhtml"><f:param name="id" value="#{person.id}"/></p:button>
                <p:commandButton icon="pi pi-trash" actionListener="#{personViewBean.deletePerson(person)}" update="mainForm" style="margin-left:.5rem">
                    <p:confirm header="Подтверждение" message="Удалить Person #{person.name}? Связанные Dragon тоже будут удалены." icon="pi pi-info-circle"/>
                </p:commandButton>
            </p:column>
        </p:dataTable>
    </h:form>
    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true">
        <p:commandButton value="Нет" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/>
        <p:commandButton value="Да" type="button" styleClass="ui-confirmdialog-yes"/>
    </p:confirmDialog>
</h:body>
</html>
